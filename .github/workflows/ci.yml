name: Verificación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código de la base de datos
        id: codigo
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verificar que el código generado esté al día
        # Si database.g.dart cambió, lo imprime comprimido en base64 para poder copiarlo.
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        run: |
          if ! git diff --quiet -- lib/data/db/database.g.dart; then
            echo "database.g.dart está desactualizado; ejecuta build_runner y súbelo."
            echo "INICIO_BASE64"
            gzip -9 -c lib/data/db/database.g.dart | base64 -w0
            echo
            echo "FIN_BASE64"
            exit 1
          fi

      - name: Análisis estático
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        run: flutter analyze

      - name: Pruebas
        # Corre aunque el análisis marque avisos, para ver ambos resultados.
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        run: flutter test

      - name: Capturas de pantalla (para revisar el diseño)
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        continue-on-error: true
        env:
          CAPTURAS: '1'
        run: |
          flutter test test/capturas_test.dart --update-goldens || echo 'Alguna captura falló'
          sudo apt-get install -y -qq poppler-utils > /dev/null
          for f in build/capturas/*.pdf; do pdftoppm -png -r 70 -f 1 -l 1 "$f" "${f%.pdf}"; done
          tar czf /tmp/capturas.tgz $(ls test/capturas/*.png build/capturas/*.png 2>/dev/null)
          echo "INICIO_CAPTURAS"
          base64 -w0 /tmp/capturas.tgz
          echo
          echo "FIN_CAPTURAS"

name: Verificación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar código de la base de datos
        id: codigo
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Análisis estático
        run: flutter analyze

      - name: Pruebas
        # Corre aunque el análisis marque avisos, para ver ambos resultados.
        if: ${{ !cancelled() && steps.codigo.outcome == 'success' }}
        run: flutter test
